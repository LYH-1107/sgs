<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机适配核心：视口设置，必须要有，否则手机显示错乱 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国杀宝珠兑换码</title>
    <link href="mycss.css" rel="stylesheet" type="text/css" />

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 16px;
            /*限制最大宽度，电脑不会拉的过宽*/
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }
        h2 {
            font-size: 26px;
        }
        .tip {
            color: red;
            font-size: 28px;
            font-weight: bold;
        }
        .content-wrap {
            display: flex;
            gap:20px;
            align-items: flex-start;
            flex-wrap: wrap; /*空间不够自动换行，手机自动上下排列*/
        }
        .img-wrap img {
            /*图片最大宽度，不会超过容器，height:auto保持图片比例不变形*/
            max-width: 100%;
            height: auto;
        }
        .side-text p {
            font-size: 22px;
            margin: 6px 0;
        }
        hr {
            margin: 24px 0;
        }
        h3 {
            font-size:24px;
        }
        li {
            font-size: 20px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <p class="tip">点击图片获得三国杀宝珠兑换码</p>

    <div class="content-wrap">
        <div class="img-wrap">
            <a href="https://www.mps.gov.cn/n9182276/c9257177/content.html" target="_blank">
                <img src="sgs_baozhu.jpg" border="3" alt="三国杀开盒图片">
            </a>

</body>
</html>
